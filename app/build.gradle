import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    id 'org.jetbrains.kotlin.plugin.serialization' version '2.3.10'
    id 'com.google.firebase.crashlytics'
    id 'com.google.devtools.ksp' version '2.3.5' apply true
    id 'com.android.application'
}

apply plugin: 'com.google.gms.google-services'

apply plugin: 'kotlin-parcelize'
//apply plugin: 'kotlin-kapt'

apply from: "https://raw.githubusercontent.com/methodic-labs/methodic/main/gradles/repos.gradle"

apply plugin: 'com.google.firebase.crashlytics'

def signingProperties = new Properties()
signingProperties.load(new FileInputStream(file('signing.properties')))

android {

    compileSdk = 36
    configurations.all {
        resolutionStrategy.force 'com.google.code.findbugs:jsr305:1.3.9'
    }
    buildFeatures {
        viewBinding true
    }
    defaultConfig {
        applicationId "com.openlattice.chronicle"
        minSdk = 26
        targetSdk = 36
        versionCode 47
        versionName "2026-02-13"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables.useSupportLibrary = true

        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }
    }
    signingConfigs {
        chronicle {
            keyAlias signingProperties['keyAlias']
            keyPassword signingProperties['keyPassword']
            storeFile file(signingProperties['storeFile'])
            storePassword signingProperties['storePassword']
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            debuggable true
            signingConfig signingConfigs.chronicle
        }
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.chronicle
        }
        debugMinified {
            initWith debug
            applicationIdSuffix ".debug"
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            debuggable true
            signingConfig signingConfigs.chronicle
        }
        releaseMinified {
            initWith release
            signingConfig signingConfigs.chronicle
        }
    }
    compileOptions {
        coreLibraryDesugaringEnabled true
        targetCompatibility 17
        sourceCompatibility 17
    }
    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES']
        }
    }

    kotlin {
        compilerOptions {
            jvmTarget = JvmTarget.JVM_17
        }
    }

    lint {
        abortOnError false
    }
    namespace 'com.openlattice.chronicle'
}

ksp {
    arg('room.schemaLocation', "$projectDir/schemas")
}

ext.jackson_version = '2.21.0'
ext.activity_version = '1.6.0'

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'

    implementation fileTree(dir: 'libs', include: ['*.jar'])

    implementation platform('com.google.firebase:firebase-bom:34.9.0')
    implementation("org.apache.olingo:odata-commons-api:5.0.0")

    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-crashlytics'

    implementation 'com.google.guava:listenablefuture:9999.0-empty-to-avoid-conflict-with-guava'

    implementation "androidx.activity:activity-ktx:1.12.3"

    // WorkManager
    implementation "androidx.work:work-runtime-ktx:2.11.1"
    implementation "org.apache.commons:commons-lang3:3.20.0"
    implementation 'com.google.code.gson:gson:2.13.2'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'com.squareup.retrofit2:retrofit:3.0.0'
    implementation('com.methodic:chronicle-api:0.1.7-SNAPSHOT') {
        exclude module: 'guava'
        exclude group: 'org.apache.olingo'
        exclude module: 'slf4j-api'
    }
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation("com.fasterxml.jackson.datatype:jackson-datatype-guava:${jackson_version}") {
        exclude module: 'guava'
    }

    implementation "com.fasterxml.jackson.core:jackson-core:${jackson_version}"
    implementation "com.fasterxml.jackson.core:jackson-databind:2.21.0"
    implementation "com.fasterxml.jackson.datatype:jackson-datatype-jsr310:${jackson_version}"
    implementation "com.fasterxml.jackson.module:jackson-module-kotlin:${jackson_version}"

    implementation 'org.slf4j:slf4j-android:1.7.36'
    implementation 'org.slf4j:slf4j-android:1.7.36'
    implementation 'com.google.guava:guava:33.5.0-android'
    implementation 'org.dmfs:lib-recur:0.17.1'

    implementation 'androidx.room:room-runtime:2.8.4'
    implementation 'androidx.room:room-ktx:2.8.4'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    ksp 'androidx.room:room-compiler:2.8.4'
    annotationProcessor 'androidx.room:room-compiler:2.8.4'
    implementation 'androidx.room:room-runtime:2.8.4'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}
